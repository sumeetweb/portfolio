<div class="lamp" id="theme-lamp">
  <div class="lamp-light" aria-hidden="true"></div>
  <svg class="lamp-fixture" viewBox="0 0 104 94" fill="none" aria-hidden="true">
    <defs>
      <linearGradient id="lamp-enamel" x1="16" y1="30" x2="89" y2="66" gradientUnits="userSpaceOnUse"><stop stop-color="var(--lamp-shade-light)"/><stop offset=".48" stop-color="var(--lamp-shade-mid)"/><stop offset="1" stop-color="var(--lamp-shade-edge)"/></linearGradient>
      <radialGradient id="lamp-underlight"><stop stop-color="var(--lamp-bulb)"/><stop offset="1" stop-color="var(--lamp-inner)"/></radialGradient>

    <path class="lamp-wire" d="M52 0v23"/>
