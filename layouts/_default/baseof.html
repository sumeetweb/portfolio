<!doctype html>
<html lang="en" data-theme="light">
<head>{{ partial "head.html" . }}</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  {{ partial "float.html" . }}
  <div class="site-shell">
    {{ partial "header.html" . }}
    <main id="main-content" tabindex="-1">{{ block "content" . }}{{ end }}</main>
    {{ partial "footer.html" . }}
  </div>
  <div class="lamp-bloom" aria-hidden="true"></div>
  <span class="sr-only" id="theme-status" role="status" aria-live="polite"></span>
  {{ $script := resources.Get "js/portfolio.js" | minify | fingerprint }}
  <script src="{{ $script.RelPermalink }}" integrity="{{ $script.Data.Integrity }}" defer></script>
</body>
</html>
