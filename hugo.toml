baseURL = "https://sumeetnaik.com/"
title = "Sumeet Naik"
locale = "en-US"
defaultContentLanguage = "en"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]

[pagination]
  pagerSize = 12

[params]
  author = "Sumeet Naik"
  role = "Backend & Cloud Engineer"
  description = "Sumeet Naik — backend engineer building APIs, cloud infrastructure, and useful software."
  avatar = "images/avatar.webp"
  email = "hi@sumeetnaik.com"
  github = "https://github.com/sumeetweb"
  linkedin = "https://www.linkedin.com/in/sumeetnaik19/"

[[menus.main]]
  name = "Notes"
  pageRef = "/notes"
  weight = 10
[[menus.main]]
  name = "Blog"
  pageRef = "/blog"
  weight = 20
[[menus.main]]
  name = "Projects"
  pageRef = "/projects"
  weight = 30
[[menus.main]]
  name = "Archive"
  pageRef = "/archive"
  weight = 40

[outputs]
  home = ["HTML", "RSS", "AGENTS", "MARKDOWN"]
  section = ["HTML", "RSS", "MARKDOWN"]
  page = ["HTML", "MARKDOWN"]

[outputFormats.AGENTS]
  mediaType = "text/markdown"
  baseName = "agents"
  isPlainText = true
  notAlternative = true

[outputFormats.MARKDOWN]
  mediaType = "text/markdown"
  baseName = "index"
  isPlainText = true
  notAlternative = true

[markup]
  [markup.highlight]
    noClasses = false
    guessSyntax = true
  [markup.goldmark.renderer]
    unsafe = false
